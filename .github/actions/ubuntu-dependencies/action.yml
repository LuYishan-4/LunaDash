name: Ubuntu native dependencies
description: Shared compiler, Qt, Wayland and integration test dependencies
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        sudo apt-get update
        sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
          cmake g++ git ninja-build pkg-config python3 ccache clang clang-tidy \
          libgl-dev libgl1-mesa-dri libwayland-dev wayland-protocols libwlroots-dev \
          libinput-dev libxkbcommon-dev libudev-dev libglib2.0-dev \
          qt6-base-dev qt6-declarative-dev qt6-declarative-dev-tools qt6-wayland \
          qt6-shadertools-dev libqt6opengl6-dev libqt6svg6 \
          qml6-module-qttest qml6-module-qtquick-controls qml6-module-qtquick-layouts \
          qml6-module-qtquick-window qml6-module-qtquick-templates \
          qml6-module-qtquick-shapes qml6-module-qtqml-workerscript \
          xvfb xauth xdotool xwayland wayland-utils wl-clipboard grim shared-mime-info \
          dbus-x11 python3-dbus python3-gi xdg-desktop-portal xdg-desktop-portal-gtk

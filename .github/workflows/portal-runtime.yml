name: Portal runtime integration
on: [push, pull_request, merge_group, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: portal-runtime-${{ github.ref }}
  cancel-in-progress: true
jobs:
  dialogs:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install build and real portal test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ pkg-config libgl-dev \
            libwayland-dev wayland-protocols libwlroots-dev libinput-dev \
            libxkbcommon-dev libudev-dev libglib2.0-dev qt6-base-dev \
            qt6-declarative-dev qt6-wayland libqt6opengl6-dev \
            xdg-desktop-portal dbus-x11 xvfb xauth xdotool python3-dbus python3-gi
      - name: Verify session bus reuse and desktop routing
        run: python3 tests/wayland/test_session_launcher.py
      - name: Build the actual portal backend
        run: |
          cmake -S . -B build-portal -G Ninja -DCMAKE_BUILD_TYPE=Debug
          cmake --build build-portal --target lunadash-portal --parallel 2
      - name: Exercise cross-process dialogs and portal responses
        run: |
          runtime=$(mktemp -d)
          trap 'rm -rf "$runtime"' EXIT
          chmod 700 "$runtime"
          XDG_RUNTIME_DIR="$runtime" xvfb-run -a -s '-screen 0 1440x1000x24' \
            dbus-run-session -- python3 tests/portal/test_runtime.py build-portal
      - name: Preserve backend and frontend diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portal-runtime-diagnostics
          path: build-portal/portal-runtime/
          if-no-files-found: ignore
  arch-dialogs:
    runs-on: ubuntu-24.04
    container: archlinux:latest
    timeout-minutes: 15
    steps:
      - name: Install current Arch Qt and portal dependencies
        run: |
          pacman -Syu --noconfirm base-devel git cmake ninja pkgconf \
            mesa wayland wayland-protocols wlroots0.20 libinput libxkbcommon glib2 \
            qt6-base qt6-declarative qt6-wayland xdg-desktop-portal dbus \
            xorg-server-xvfb xorg-xauth xdotool python-dbus python-gobject
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build and exercise real dialogs on current Arch
        run: |
          cmake -S . -B build-portal-arch -G Ninja -DCMAKE_BUILD_TYPE=Debug
          cmake --build build-portal-arch --target lunadash-portal --parallel 2
          runtime=$(mktemp -d)
          trap 'rm -rf "$runtime"' EXIT
          chmod 700 "$runtime"
          XDG_RUNTIME_DIR="$runtime" xvfb-run -a -s '-screen 0 1440x1000x24' \
            dbus-run-session -- python3 tests/portal/test_runtime.py build-portal-arch
      - name: Preserve Arch runtime diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portal-runtime-arch-diagnostics
          path: build-portal-arch/portal-runtime/
          if-no-files-found: ignore

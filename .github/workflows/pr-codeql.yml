name: CodeQL analysis suite
on:
  workflow_call:
permissions:
  contents: read
jobs:
  codeql:
    name: CodeQL security analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/ubuntu-dependencies
      - uses: github/codeql-action/init@v4
        with:
          languages: c-cpp
          build-mode: manual
          config-file: ./.github/codeql/config.yml
      - name: Build for CodeQL
        run: cmake -S . -B build-codeql -G Ninja -DCMAKE_BUILD_TYPE=Debug && cmake --build build-codeql --parallel 2
      - uses: github/codeql-action/analyze@v4
        id: codeql
        with:
          output: codeql-results
      - name: Reject CodeQL findings
        if: always() && (steps.codeql.outcome == 'success' || hashFiles('codeql-results/*.sarif') != '')
        run: python3 scripts/security/check_sarif.py codeql-results

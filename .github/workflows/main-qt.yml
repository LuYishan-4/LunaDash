name: Main Qt loading
on: [push, pull_request, merge_group, workflow_dispatch]
permissions:
    contents: read
concurrency:
    group: main-qt-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true
jobs:
    qt:
        name: Qt module and compositor loading
        runs-on: ubuntu-24.04
        timeout-minutes: 25
        steps:
            - uses: actions/checkout@v4
              with:
                  persist-credentials: false
            - name: Install dependencies
              run: |
                  sudo apt-get update
                  sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
                    cmake g++ ninja-build pkg-config libgl-dev \
                    libwayland-dev wayland-protocols \
                    libinput-dev libxkbcommon-dev libudev-dev \
                    qt6-base-dev qt6-declarative-dev qt6-wayland-dev libqt6opengl6-dev \
                    xvfb xauth python3 python3-pil
            - name: Build Qt compositor
              run: cmake -S . -B build-qt -G Ninja -DCMAKE_BUILD_TYPE=Release && cmake --build build-qt --parallel 2
            - name: Verify Qt libraries and runtime loading
              run: |
                  test -f /usr/lib/x86_64-linux-gnu/libQt6Core.so.6
                  test -f /usr/lib/x86_64-linux-gnu/libQt6WaylandCompositor.so.6
                  ldd build-qt/lunadash-compositor | grep -E 'libQt6(Core|Gui|Quick|WaylandCompositor)'
                  QT_QPA_PLATFORM=xcb LUDASH_BUILD_DIR="$GITHUB_WORKSPACE/build-qt" \
                    LUDASH_GRAPHICS=opengl \
                    LUDASH_TEST_NO_SHELL=1 ./scripts/test-wayland.sh

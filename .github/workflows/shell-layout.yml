name: Arch Quickshell desktop layout
on: [push, pull_request, merge_group, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: shell-layout-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  shell-layout:
    name: Live Quickshell layout and screenshots
    runs-on: ubuntu-24.04
    container: archlinux:latest
    timeout-minutes: 30
    steps:
      - name: Bootstrap Arch toolchain
        run: |
          pacman -Syu --noconfirm --needed base-devel git cmake ninja python python-pillow pkgconf \
            libglvnd mesa wayland wayland-protocols libinput libxkbcommon systemd glib2 \
            qt6-base qt6-declarative qt6-wayland qt6-svg qt6-multimedia \
            dbus grim wtype at-spi2-core python-atspi wl-clipboard usbutils \
            noto-fonts noto-fonts-cjk hicolor-icon-theme
          wlroots_package=wlroots0.20
          if ! pacman -Si "$wlroots_package" >/dev/null 2>&1; then
            wlroots_package=wlroots
          fi
          pacman -S --noconfirm --needed "$wlroots_package"
          # Use the official repository package, as the installer does. Missing
          # Quickshell must fail this runtime job instead of silently skipping it.
          pacman -Si quickshell
          pacman -S --noconfirm --needed quickshell
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build compositor and shell helpers
        run: |
          cmake -S . -B build-shell-layout -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build-shell-layout --parallel 2 --target \
            ludash-compositor ludash-desktop ludashctl ludash-shell-tool \
            lunadash-scene-backdrop-test lunadash-window-glass-test lunadash-window-layout-test \
            lunadash-corner-geometry-test
          # Mirror the installed helper location when running from the build tree.
          cp scripts/lunadash-clipboard-history build-shell-layout/lunadash-clipboard-history
      - name: Check backdrop pixels, rounded geometry, ownership and recursive window layout
        run: QT_QPA_PLATFORM=offscreen ctest --test-dir build-shell-layout --output-on-failure -R '^lunadash-(scene-backdrop|window-glass|window-layout|corner-geometry)$'
      - name: Exercise Settings through accessibility and real Wayland keyboard input
        run: timeout 300 dbus-run-session -- python3 tests/wayland/test_shell_layout.py build-shell-layout
      - name: Preserve desktop screenshots and runtime diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arch-quickshell-layout
          path: build-shell-layout/ci-evidence/shell-layout/
          if-no-files-found: warn
          retention-days: 14

name: Main OpenGL loading
on: [push, pull_request, merge_group, workflow_dispatch]
permissions:
    contents: read
concurrency:
    group: main-opengl-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true
jobs:
    opengl:
        name: GLSL assets and wlroots GLES2 loading
        runs-on: ubuntu-24.04
        timeout-minutes: 25
        steps:
            - uses: actions/checkout@v4
              with:
                  persist-credentials: false
            - name: Install dependencies
              run: |
                  sudo apt-get update
                  sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
                    cmake g++ ninja-build pkg-config python3 \
                    libgl-dev libgl1-mesa-dri libwayland-dev wayland-protocols \
                    libwlroots-dev libinput-dev libxkbcommon-dev libudev-dev libglib2.0-dev \
                    qt6-base-dev qt6-declarative-dev qt6-wayland \
                    libqt6opengl6-dev xvfb xauth
            - name: Validate shader asset conventions
              run: python3 tests/renderer/test_shader_extensions.py
            - name: Build renderer and compositor
              run: cmake -S . -B build-opengl -G Ninja -DCMAKE_BUILD_TYPE=Release && cmake --build build-opengl --parallel 2
            - name: Run wlroots GLES2 smoke test
              run: |
                  WLR_RENDERER=gles2 LUDASH_TEST_NO_SHELL=1 \
                    LUDASH_BUILD_DIR="$PWD/build-opengl" ./scripts/test-wayland.sh
            - name: Preserve graphics diagnostics
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: main-opengl-diagnostics
                  path: |
                      build-opengl/wayland.log
                      build-opengl/wayland-state.json
                  if-no-files-found: ignore
                  retention-days: 7

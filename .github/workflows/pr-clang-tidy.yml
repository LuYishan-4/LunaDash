name: C++ analysis suite
on:
  workflow_call:
permissions:
  contents: read
jobs:
  clang-tidy:
    name: C/C++ null and memory safety analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fetch pinned LunaDash-Shell source
        run: bash scripts/fetch-shell.sh "$RUNNER_TEMP/LunaDash-Shell"
      - uses: ./.github/actions/ubuntu-dependencies
      - name: Verify Qt lifetime analyzer
        run: python3 tests/security/test_analyzer.py clang-tidy
      - name: Analyze production code
        run: |
          cmake -S . -B build-pr -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DLUDASH_QML_SOURCE_DIR="$RUNNER_TEMP/LunaDash-Shell" \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DBUILD_TESTING=OFF \
            -DCMAKE_CXX_CLANG_TIDY=clang-tidy 2>&1 | tee build-pr.log
          test "${PIPESTATUS[0]}" -eq 0
          cmake --build build-pr --parallel 2 -- -k 0 2>&1 | tee -a build-pr.log
          test "${PIPESTATUS[0]}" -eq 0
      - name: Report analysis failures
        if: failure()
        run: python3 scripts/ci/report_build_errors.py clang-tidy build-pr.log

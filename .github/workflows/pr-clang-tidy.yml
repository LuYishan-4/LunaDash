name: C++ analysis suite
on:
  workflow_call:
permissions:
  contents: read
jobs:
  clang-tidy:
    name: C/C++ null and memory safety analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/ubuntu-dependencies
      - name: Verify Qt lifetime analyzer
        run: python3 tests/security/test_analyzer.py clang-tidy
      - name: Analyze production code
        run: |
          cmake -S . -B build-pr -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DBUILD_TESTING=OFF \
            -DCMAKE_CXX_CLANG_TIDY=clang-tidy
          cmake --build build-pr --parallel 2

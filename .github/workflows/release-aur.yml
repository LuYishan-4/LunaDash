name: AUR packages
on:
    release:
        types: [published]
    workflow_dispatch:
        inputs:
            tag:
                description: Release tag to publish to the AUR
                required: true
            push:
                description: Push to the AUR (otherwise only show the package changes)
                type: boolean
                default: false
permissions:
    contents: read
concurrency:
    group: aur
    cancel-in-progress: false
jobs:
    aur:
        name: Update slintlu, lunadash-shell and ludash
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        container: archlinux:base-devel
        env:
            TAG: ${{ github.event.release.tag_name || inputs.tag }}
            PUSH: ${{ github.event_name == 'release' || inputs.push }}
        steps:
            - name: Install tools
              run: pacman -Syu --noconfirm --needed git openssh pacman-contrib
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
                  persist-credentials: false
            - name: Prepare the packaging user
              run: |
                  useradd -m builder
                  chown -R builder:builder "$GITHUB_WORKSPACE"
            - name: Configure AUR SSH
              if: env.PUSH == 'true'
              env:
                  AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
              run: |
                  [ -n "$AUR_SSH_PRIVATE_KEY" ] || { echo "::error::The AUR_SSH_PRIVATE_KEY secret is not set"; exit 1; }
                  ssh_dir=/home/builder/.ssh
                  install -d -m 700 -o builder -g builder "$ssh_dir"
                  printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > "$ssh_dir/aur"
                  # ED25519 SHA256:RFzBCUItH9LZS0cKB5UE6ceAYhBD5C8GeOBip8Z11+4, as published on aur.archlinux.org.
                  echo 'aur.archlinux.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEuBKrPzbawxA/k2g6NcyV5jmqwJ2s+zpgZGZ7tpLIcN' > "$ssh_dir/known_hosts"
                  printf 'Host aur.archlinux.org\n    User aur\n    IdentityFile ~/.ssh/aur\n    IdentitiesOnly yes\n' > "$ssh_dir/config"
                  chown builder:builder "$ssh_dir"/*
                  chmod 600 "$ssh_dir"/*
            - name: Update the AUR packages
              env:
                  GIT_AUTHOR_NAME: LunaDash release automation
                  GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
                  GIT_COMMITTER_NAME: LunaDash release automation
                  GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
              run: |
                  flag=
                  [ "$PUSH" = true ] && flag=--push
                  runuser -u builder -- bash scripts/ci/update-aur.sh "$TAG" $flag

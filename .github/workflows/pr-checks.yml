name: Pull request checks
on:
    pull_request:
    merge_group:
    workflow_dispatch:
permissions:
    contents: read
concurrency:
    group: pr-checks-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true
jobs:
    documentation-scope:
        name: Reject documentation changes
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
                  persist-credentials: false
            - name: Reject documentation changes
              env:
                  GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
              run: python3 scripts/security/check_pr_scope.py

    repository-hygiene:
        name: Repository hygiene and workflow policy
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v4
              with:
                  persist-credentials: false
            - name: Check workflows
              run: python3 scripts/security/check_repository_hygiene.py workflows
            - name: Scan credentials
              run: python3 scripts/security/check_repository_hygiene.py secrets
            - name: Scan personal paths
              run: python3 scripts/security/check_repository_hygiene.py paths

    source-style:
        name: Source language and shell style
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v4
              with:
                  persist-credentials: false
            - name: Install style tools
              run: sudo apt-get update && sudo apt-get install -y shellcheck
            - name: Check source language
              run: python3 tests/security/test_source_language.py
            - name: Check shell scripts
              run: |
                  find scripts -type f -name '*.sh' -print0 | xargs -0 -r -n1 sh -n
                  find scripts -type f -name '*.sh' -print0 | xargs -0 -r shellcheck --severity=error

    qt-pointer-analysis:
        name: Qt pointer and lifetime analysis
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v4
              with:
                  persist-credentials: false
            - name: Install Qt analysis dependencies
              run: |
                  sudo apt-get update
                  sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
                    clang-tidy pkg-config qt6-base-dev
            - name: Check Qt guards and use-after-free detection
              run: python3 tests/security/test_analyzer.py clang-tidy

    clang-tidy:
        name: C/C++ null and memory safety analysis
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v4
              with:
                  persist-credentials: false
            - name: Install C/C++ dependencies
              run: |
                  sudo apt-get update
                  sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
                    clang clang-tidy cmake g++ ninja-build pkg-config \
                    libwayland-dev qt6-base-dev qt6-declarative-dev \
                    qt6-wayland-dev libqt6opengl6-dev
            - name: Analyze production code
              run: |
                  cmake -S . -B build-pr -G Ninja \
                    -DCMAKE_BUILD_TYPE=Debug \
                    -DCMAKE_C_COMPILER=clang \
                    -DCMAKE_CXX_COMPILER=clang++ \
                    -DCMAKE_CXX_CLANG_TIDY=clang-tidy
                  cmake --build build-pr --parallel 2

    codeql:
        name: CodeQL security analysis
        runs-on: ubuntu-24.04
        permissions:
            actions: read
            contents: read
            security-events: write
        steps:
            - uses: actions/checkout@v4
              with:
                  persist-credentials: false
            - name: Install C/C++ dependencies
              run: |
                  sudo apt-get update
                  sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
                    cmake g++ ninja-build pkg-config libwayland-dev \
                    qt6-base-dev qt6-declarative-dev qt6-wayland-dev \
                    libqt6opengl6-dev
            - uses: github/codeql-action/init@v4
              with:
                  languages: c-cpp
                  build-mode: manual
                  config-file: ./.github/codeql/config.yml
            - name: Build for CodeQL
              run: cmake -S . -B build-codeql -G Ninja -DCMAKE_BUILD_TYPE=Debug && cmake --build build-codeql --parallel 2
            - uses: github/codeql-action/analyze@v4
              id: codeql
              with:
                  output: codeql-results
            - name: Reject CodeQL findings
              if: always() && (steps.codeql.outcome == 'success' || hashFiles('codeql-results/*.sarif') != '')
              run: python3 scripts/security/check_sarif.py codeql-results

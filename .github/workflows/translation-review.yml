name: Localization review
on: [push, pull_request, merge_group, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: translations-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  coverage:
    name: Translation coverage and placeholders
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 scripts/test-translation-checker.py
      - run: python3 scripts/check-translations.py
  resources:
    name: Compiled translations and QML localization regression
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Qt build and QML test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ qt6-base-dev qt6-declarative-dev-tools \
            qml6-module-qtquick qml6-module-qtquick-controls qml6-module-qtquick-layouts \
            qml6-module-qtquick-templates qml6-module-qtquick-window qml6-module-qtquick-shapes \
            qml6-module-qtqml-workerscript qml6-module-qttest libqt6svg6
      - name: Parse all shell QML files
        run: |
          while IFS= read -r -d '' file; do
            /usr/lib/qt6/bin/qmlformat "$file" > /dev/null
          done < <(find qml -type f -name '*.qml' -print0)
      - name: Build and test every packaged locale
        run: |
          cmake -S tests/localization -B build-translations -G Ninja
          cmake --build build-translations --parallel 2
          ctest --test-dir build-translations --output-on-failure
      - name: Test translated dropdown labels and scroll stability
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: /usr/lib/qt6/bin/qmltestrunner -input tests/qml/tst_translated_dropdown.qml

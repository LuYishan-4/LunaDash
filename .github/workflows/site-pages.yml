name: Website Pages deployment
on:
    push:
        branches: [main]
    schedule:
        - cron: "17 7 * * *"
    release:
        types: [published, edited, deleted]
    workflow_dispatch:
permissions:
    contents: read
    pages: write
    id-token: write
concurrency:
    group: pages
    cancel-in-progress: false
jobs:
    deploy:
        name: Deploy website and GitHub release notes
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - uses: actions/checkout@v7
              with:
                  ref: main
                  persist-credentials: false
            - name: Fetch website source
              run: git clone --quiet --depth 1 https://github.com/LunaDash-DE/LunaDash-docs.git "$RUNNER_TEMP/LunaDash-docs"
            - name: Sync published GitHub Release Markdown
              env:
                  GITHUB_TOKEN: ${{ github.token }}
                  LUDASH_SITE_SOURCE_DIR: ${{ runner.temp }}/LunaDash-docs
              run: python3 scripts/site/sync-releases.py
            - name: Set up Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: "22"
            - name: Install website dependencies
              run: npm ci --prefix "$RUNNER_TEMP/LunaDash-docs" --include=dev --ignore-scripts
            - name: Check the website
              run: npm run check --prefix "$RUNNER_TEMP/LunaDash-docs"
            - name: Build the website
              run: npm run build --prefix "$RUNNER_TEMP/LunaDash-docs"
            - name: Test the built website
              run: python3 "$RUNNER_TEMP/LunaDash-docs/scripts/test-site.py" "$RUNNER_TEMP/LunaDash-docs/dist"
            - name: Configure Pages
              uses: actions/configure-pages@v6
            - name: Upload the Pages artifact
              uses: actions/upload-pages-artifact@v5
              with:
                  path: ${{ runner.temp }}/LunaDash-docs/dist
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v5

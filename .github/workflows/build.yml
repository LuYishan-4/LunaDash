name: Ubuntu build
on: [push, pull_request, merge_group, workflow_dispatch]
permissions:
    contents: read
concurrency:
    group: ubuntu-build-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true
jobs:
    build:
        name: Ubuntu 24.04 build, Qt/Wayland and OpenGL tests
        timeout-minutes: 25
        runs-on: ubuntu-24.04
        steps:
            - name: Install dependencies
              run: |
                  sudo apt-get update
                  sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
                    cmake g++ git ninja-build pkg-config python3 python3-pil \
                    libgl-dev libgl1-mesa-dri libwayland-dev wayland-protocols \
                    qt6-base-dev qt6-declarative-dev qt6-wayland-dev \
                    libqt6opengl6-dev xvfb xauth
            - uses: actions/checkout@v4
              with:
                  persist-credentials: false
            - name: Build C/C++ and Qt targets
              run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release && cmake --build build
            - name: Test Qt and Wayland library loading
              run: |
                  test -f /usr/lib/x86_64-linux-gnu/libQt6WaylandCompositor.so.6
                  test -f /usr/lib/x86_64-linux-gnu/libwayland-server.so.0
                  ldd build/lunadah-compositor | grep -E 'libQt6(Core|Gui|Quick|WaylandCompositor)|libwayland-server'
                  QT_QPA_PLATFORM=offscreen LUDASH_GRAPHICS=opengl \
                    LUDASH_TEST_NO_SHELL=1 ./scripts/test-wayland.sh
            - name: Test desktop OpenGL loading
              run: LUDASH_GRAPHICS=opengl LUDASH_TEST_NO_SHELL=1 ./scripts/test-wayland.sh
            - name: Preserve Qt and OpenGL diagnostics
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: graphics-session-diagnostics
                  path: |
                      build/wayland.log
                      build/wayland-state.json
                      build/wayland-preview.png
                  if-no-files-found: ignore
                  retention-days: 7

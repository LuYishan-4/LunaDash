name: Ubuntu build
on: [push, pull_request, merge_group, workflow_dispatch]
permissions:
    contents: read
concurrency:
    group: ubuntu-build-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true
jobs:
    build:
        name: Ubuntu 24.04 build and OpenGL smoke test
        timeout-minutes: 25
        runs-on: ubuntu-24.04
        steps:
            - name: Install dependencies
              run: |
                  sudo apt-get update
                  sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
                    cmake g++ git ninja-build pkg-config python3 python3-pil \
                    libgl-dev libgl1-mesa-dri libwayland-dev wayland-protocols \
                    qt6-base-dev qt6-declarative-dev qt6-wayland-dev \
                    libqt6-opengl6-dev xvfb xauth
            - uses: actions/checkout@v4
              with:
                  persist-credentials: false
            - name: Build
              run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release && cmake --build build
            - name: Test desktop OpenGL loading
              run: LUDASH_GRAPHICS=opengl LUDASH_TEST_NO_SHELL=1 ./scripts/test-wayland.sh
            - name: Preserve OpenGL diagnostics
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: opengl-session-diagnostics
                  path: |
                      build/wayland.log
                      build/wayland-state.json
                      build/wayland-preview.png
                  if-no-files-found: ignore
                  retention-days: 7

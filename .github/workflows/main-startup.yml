name: Main startup checks
on: [push, pull_request, merge_group, workflow_dispatch]
permissions:
    contents: read
concurrency:
    group: main-startup-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true
jobs:
    startup:
        name: wlroots startup failure handling
        runs-on: ubuntu-24.04
        timeout-minutes: 25
        steps:
            - uses: actions/checkout@v4
              with:
                  persist-credentials: false
            - name: Install dependencies
              run: |
                  sudo apt-get update
                  sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
                    cmake g++ ninja-build pkg-config libgl-dev \
                    libwayland-dev wayland-protocols libwlroots-dev \
                    libinput-dev libxkbcommon-dev libudev-dev libglib2.0-dev \
                    qt6-base-dev qt6-declarative-dev qt6-wayland libqt6opengl6-dev \
                    xvfb xauth python3
            - name: Build startup target
              run: cmake -S . -B build-startup -G Ninja -DCMAKE_BUILD_TYPE=Debug && cmake --build build-startup --parallel 2
            - name: Verify controlled wlroots startup errors
              run: |
                  runtime=$(mktemp -d)
                  chmod 700 "$runtime"
                  set +e
                  xvfb-run -a env XDG_RUNTIME_DIR="$runtime" WLR_BACKENDS=x11 \
                    WLR_RENDERER=not-a-renderer LUDASH_DISABLE_XWAYLAND=1 \
                    timeout 8s build-startup/lunadash-compositor --no-shell \
                    --socket ludash-invalid-renderer >build-startup/startup-failure.log 2>&1
                  status=$?
                  set -e
                  cat build-startup/startup-failure.log
                  rm -rf "$runtime"
                  test "$status" -ne 0

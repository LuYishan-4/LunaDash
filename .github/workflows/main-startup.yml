name: Main startup checks
on: [push, pull_request, merge_group, workflow_dispatch]
permissions:
    contents: read
concurrency:
    group: main-startup-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true
jobs:
    startup:
        name: wlroots startup handling
        runs-on: ubuntu-24.04
        timeout-minutes: 25
        steps:
            - uses: actions/checkout@v4
              with:
                  persist-credentials: false
            - name: Install dependencies
              run: |
                  sudo apt-get update
                  sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
                    cmake g++ ninja-build pkg-config libgl-dev \
                    libwayland-dev wayland-protocols libwlroots-dev \
                    libinput-dev libxkbcommon-dev libudev-dev libglib2.0-dev \
                    qt6-base-dev qt6-declarative-dev qt6-wayland libqt6opengl6-dev \
                    xvfb xauth python3 dbus
            - name: Build startup target
              run: cmake -S . -B build-startup -G Ninja -DCMAKE_BUILD_TYPE=Debug && cmake --build build-startup --parallel 2
            - name: Verify portal activation cannot deadlock
              run: python3 tests/wayland/test_portal_activation.py build-startup
            - name: Verify renderer startup handling
              run: python3 tests/renderer/test_startup_failure.py build-startup/lunadash-compositor

name: PR source style
on:
  pull_request:
    branches: [dev]
    paths:
      - "src/**"
      - "include/**"
      - "qml/**"
      - "scripts/**"
      - "tests/**"
      - "CMakeLists.txt"
      - "cmake/**"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pr-source-style-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  source-style:
    name: Source, shell and QML style
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install style tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Check source language
        run: python3 tests/security/test_source_language.py
      - name: Check shell scripts
        run: |
          find scripts -type f -name '*.sh' -print0 | xargs -0 -r -n1 sh -n
          find scripts -type f -name '*.sh' -print0 | xargs -0 -r shellcheck --severity=error
      - name: Check QML design-system usage
        run: python3 scripts/ci/check_qml_style.py

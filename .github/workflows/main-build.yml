name: Main Ubuntu build
on: [push, pull_request, merge_group, workflow_dispatch]
permissions:
    contents: read
concurrency:
    group: main-build-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true
jobs:
    build:
        name: Ubuntu 24.04 C/C++ build
        runs-on: ubuntu-24.04
        timeout-minutes: 25
        steps:
            - uses: actions/checkout@v4
              with:
                  persist-credentials: false
            - name: Install dependencies
              run: |
                  sudo apt-get update
                  sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
                    cmake g++ git ninja-build pkg-config \
                    libgl-dev libwayland-dev wayland-protocols libwlroots-dev \
                    libinput-dev libxkbcommon-dev libudev-dev libglib2.0-dev \
                    qt6-base-dev qt6-declarative-dev qt6-wayland \
                    libqt6opengl6-dev shared-mime-info
            - name: Build
              run: cmake -S . -B build-main -G Ninja -DCMAKE_BUILD_TYPE=Release -DLUDASH_BUILD_FILES_TESTS=ON && cmake --build build-main --parallel 2
            - name: Test file operations and compositor architecture
              run: |
                  QT_QPA_PLATFORM=offscreen ctest --test-dir build-main --output-on-failure
                  python3 scripts/check-source-layout.py
                  python3 tests/architecture/test_source_layout.py
                  python3 tests/wayland/test_no_qtwayland.py
                  python3 tests/renderer/test_render_architecture.py
            - name: Checkout community plugin registry
              uses: actions/checkout@v4
              with:
                  repository: LuYishan-4/LunaDash-Plugins
                  ref: main
                  path: external-plugins
                  persist-credentials: false
            - name: Build and install KDE multi-target plugin with current SDK
              run: |
                  cmake -S external-plugins/plugins/org.lunadash.kde-behavior \
                    -B build-kde-plugin -G Ninja \
                    -DLunaDashPlugin_DIR="$PWD/build-main/sdk-build" \
                    -DCMAKE_INSTALL_PREFIX="$PWD/external-prefix"
                  cmake --build build-kde-plugin --parallel 2
                  cmake --install build-kde-plugin
                  test -f external-prefix/share/lunadash/plugins/org.lunadash.kde-behavior/.lunadash-sdk.json
                  test -f external-prefix/share/lunadash/plugins/org.lunadash.kde-behavior/liblunadash-kde-behavior.so
                  test -f external-prefix/share/lunadash/plugins/org.lunadash.kde-behavior/KdePanel.qml
            - name: Exercise external multi-target runtime hooks
              env:
                  LUNADASH_EXTERNAL_PLUGIN_DIR: ${{ github.workspace }}/external-prefix/share/lunadash/plugins/org.lunadash.kde-behavior
                  QT_QPA_PLATFORM: offscreen
              run: ./build-main/lunadash-plugin-test externalMultiTarget

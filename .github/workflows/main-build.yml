name: Shared CI builds
on:
  workflow_call:
    inputs:
      full:
        type: boolean
        default: false
permissions:
  contents: read
# CI only builds. Tests run locally with scripts/run-tests.sh (docs/en/TESTING.md).
jobs:
  changes:
    name: Select suites
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      native: ${{ steps.select.outputs.native }}
      website: ${{ steps.select.outputs.website }}
      nix: ${{ steps.select.outputs.nix }}
      distro: ${{ steps.select.outputs.distro }}
      analysis: ${{ steps.select.outputs.analysis }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: select
        env:
          CI_FULL: ${{ inputs.full }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/changes.py

  native:
    name: Ubuntu build
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Fetch pinned LunaDash-Shell and SlintLu sources
        run: |
          bash scripts/fetch-shell.sh "$RUNNER_TEMP/LunaDash-Shell"
          bash scripts/fetch-slintlu.sh "$RUNNER_TEMP/SlintLu"
      - name: Install the Rust toolchain required by Slint
        uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/ubuntu-dependencies
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ccache
          key: ubuntu-native-v1-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ubuntu-native-v1-${{ github.ref_name }}-
            ubuntu-native-v1-
      # Slint is compiled from pinned Rust sources. Reuse its Cargo output
      # across runs; C/C++ objects are covered by ccache above.
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            build-main/cargo
            build-main/_deps
          key: ubuntu-slint-v1-${{ hashFiles('CMakeLists.txt') }}-${{ github.sha }}
          restore-keys: |
            ubuntu-slint-v1-${{ hashFiles('CMakeLists.txt') }}-
      # SlintLu (the shell runtime) only changes with packaging/slintlu-revision.
      - uses: actions/cache@v6
        with:
          path: build-main/slintlu
          key: ubuntu-slintlu-v1-${{ hashFiles('packaging/slintlu-revision') }}
      - name: Configure and build
        id: build
        run: |
          ccache --max-size=500M
          cmake -S . -B build-main -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DLUDASH_SHELL_SOURCE_DIR="$RUNNER_TEMP/LunaDash-Shell" \
            -DLUDASH_SLINTLU_SOURCE_DIR="$RUNNER_TEMP/SlintLu" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DBUILD_TESTING=OFF \
            2>&1 | tee build-main.log
          test "${PIPESTATUS[0]}" -eq 0
          cmake --build build-main --parallel 2 -- -k 0 2>&1 | tee -a build-main.log
          test "${PIPESTATUS[0]}" -eq 0
      - name: Report build failures
        if: ${{ failure() && steps.build.outcome == 'failure' }}
        run: python3 scripts/ci/report_build_errors.py Ubuntu build-main.log

  website:
    needs: changes
    if: needs.changes.outputs.website == 'true'
    uses: ./.github/workflows/main-site.yml

  nix:
    name: NixOS package build
    needs: changes
    if: needs.changes.outputs.nix == 'true'
    runs-on: ubuntu-24.04
    # A cold store builds Slint, SlintLu and LunaDash from source; cached runs rebuild only
    # the derivations whose inputs changed.
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
      - name: Restore and save the Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock', 'nix/**', 'packaging/slintlu-revision', 'packaging/shell-revision') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 6G
      - name: Build the package
        run: scripts/ci/annotate.sh "nix build" nix build .#default --print-build-logs --no-update-lock-file

  distributions:
    needs: changes
    if: needs.changes.outputs.distro == 'true'
    uses: ./.github/workflows/distro-build.yml
    with:
      full: ${{ inputs.full || needs.changes.outputs.analysis == 'true' }}

  gate:
    name: CI result
    needs: [changes, native, website, nix, distributions]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every selected suite to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          failures = {name: job['result'] for name, job in results.items()
                      if job['result'] not in ('success', 'skipped')}
          print(json.dumps(results, indent=2))
          if failures:
              raise SystemExit(f'CI failed: {failures}')
          selected = results['changes']['outputs']
          for output, job in [('native', 'native'), ('website', 'website'),
                              ('nix', 'nix'), ('distro', 'distributions')]:
              if selected.get(output) == 'true' and results[job]['result'] != 'success':
                  raise SystemExit(f'Selected suite did not pass: {job}')
          PY

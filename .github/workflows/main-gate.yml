name: Main required checks gate
on:
  push:
    branches: [main]
  merge_group:
    branches: [dev]
  workflow_dispatch:
permissions:
  actions: read
  contents: read
concurrency:
  group: main-gate-${{ github.sha }}
  cancel-in-progress: true
jobs:
  gate:
    name: All five main checks passed
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Wait for all five main workflows
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -eu
          expected='Main Ubuntu build|Main Qt loading|Main Wayland loading|Main OpenGL loading|Main startup checks'
          for attempt in $(seq 1 60); do
            runs=$(curl --fail-with-body --silent --show-error \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${HEAD_SHA}&per_page=100")
            result=$(printf '%s' "$runs" | EXPECTED="$expected" python3 -c '
          import json, os, sys
          expected = set(os.environ["EXPECTED"].split("|"))
          runs = json.load(sys.stdin)["workflow_runs"]
          found = {run["name"]: (run["status"], run["conclusion"]) for run in runs if run["name"] in expected}
          if set(found) != expected or any(found[name][0] != "completed" for name in expected):
              print("pending")
          elif all(found[name][1] == "success" for name in expected):
              print("passed")
          else:
              print("failed")
          ')
            case "$result" in
              passed) echo "All five main checks passed."; exit 0 ;;
              failed) echo "At least one main check failed."; exit 1 ;;
            esac
            sleep 30
          done
          echo "Timed out waiting for all five main checks."
          exit 1

name: QML action review
on: [push, pull_request, merge_group, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: qml-action-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qml-actions:
    name: QML actions have working backends
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Audit QML actions and launch targets
        run: python3 scripts/ci/check_qml_actions.py
      - name: Verify updater and browser contracts
        run: python3 tests/update/test_update_contract.py

name: QML design system review
on: [push, pull_request, merge_group, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: qml-design-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  review:
    name: Unified QML controls and typography
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install QML parser
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y qt6-declarative-dev-tools
      - name: Parse every QML file
        run: |
          qmlformat_bin="$(command -v qmlformat6 || command -v qmlformat || true)"
          if [ -z "$qmlformat_bin" ] && [ -x /usr/lib/qt6/bin/qmlformat ]; then
            qmlformat_bin=/usr/lib/qt6/bin/qmlformat
          fi
          test -n "$qmlformat_bin"
          while IFS= read -r -d '' file; do
            "$qmlformat_bin" "$file" >/dev/null
          done < <(find qml -type f -name '*.qml' -print0)
      - name: Review QML design system
        run: python3 scripts/ci/check_qml_style.py

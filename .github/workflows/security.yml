name: Security and crash checks
on:
    push:
    pull_request:
    merge_group:
    workflow_dispatch:
permissions:
    contents: read
concurrency:
    group: security-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true
jobs:
    static-analysis:
        name: C/C++ static analysis
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v4
              with:
                  persist-credentials: false
            - name: Install dependencies
              run: sudo apt-get update && sudo apt-get install -y pkg-config libwayland-dev ninja-build clang-19 clang-tidy-19 python3 qt6-base-dev qt6-declarative-dev qt6-wayland-dev qt6-wayland libqt6opengl6-dev
            - name: Verify Qt pointer analysis and use-after-free detection
              run: python3 tests/security/test_analyzer.py clang-tidy-19
            - name: Configure clang-tidy
              run: cmake -S . -B build -G Ninja -DCMAKE_C_COMPILER=clang-19 -DCMAKE_CXX_COMPILER=clang++-19 -DCMAKE_CXX_CLANG_TIDY=clang-tidy-19
            - name: Analyze all production translation units
              run: cmake --build build --parallel 2

    sanitizers:
        name: ASan and UBSan
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        env:
            # Qt/Mesa retain process-global allocations; memory safety checks remain active.
            ASAN_OPTIONS: detect_leaks=0:halt_on_error=1:abort_on_error=1
            UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
            QT_QPA_PLATFORM: xcb
            LIBGL_ALWAYS_SOFTWARE: "1"
            LUDASH_TEST_NO_SHELL: "1"
        steps:
            - uses: actions/checkout@v4
              with:
                  persist-credentials: false
            - name: Install dependencies
              run: sudo apt-get update && sudo apt-get install -y pkg-config libwayland-dev ninja-build clang libclang-rt-18-dev qt6-base-dev qt6-declarative-dev qt6-wayland-dev qt6-wayland libqt6opengl6-dev libgl1-mesa-dri xvfb xauth xwayland xdotool python3 python3-pil
            - name: Build instrumented binaries
              run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DLUDASH_ENABLE_SANITIZERS=ON && cmake --build build --parallel 2
            - name: Run instrumented Wayland session
              run: ./scripts/test-wayland.sh
            - name: Verify authenticated X11 lifecycle
              run: xvfb-run -a python3 tests/wayland/test_xwayland.py build
            - name: Verify client crashes fail the session
              run: xvfb-run -a python3 tests/wayland/test_crash_detection.py build
            - name: Save test evidence
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: sanitizer-evidence
                  path: |
                      build/Testing/Temporary/LastTest.log
                      build/wayland-state.json
                      build/wayland-preview.png
                      build/wayland.log
                  if-no-files-found: ignore

    codeql:
        name: CodeQL security and quality
        runs-on: ubuntu-24.04
        timeout-minutes: 30
        permissions:
            actions: read
            contents: read
            security-events: write
        steps:
            - uses: actions/checkout@v4
              with:
                  persist-credentials: false
            - name: Install dependencies
              run: sudo apt-get update && sudo apt-get install -y pkg-config libwayland-dev ninja-build qt6-base-dev qt6-declarative-dev qt6-wayland-dev qt6-wayland libqt6opengl6-dev
            - uses: github/codeql-action/init@v4
              with:
                  languages: c-cpp
                  build-mode: manual
                  config-file: ./.github/codeql/config.yml
            - name: Build for CodeQL extraction
              run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug && cmake --build build --parallel 2
            - name: Analyze
              id: codeql-analysis
              uses: github/codeql-action/analyze@v4
              with:
                  output: codeql-results
            - name: Reject reported security or crash findings
              if: always() && (steps.codeql-analysis.outcome == 'success' || hashFiles('codeql-results/*.sarif') != '')
              run: python3 scripts/security/check_sarif.py codeql-results

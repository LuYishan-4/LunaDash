name: PR security checks
on:
    pull_request:
    push:
        branches: [main]
    merge_group:
    workflow_dispatch:
permissions:
    contents: read
concurrency:
    group: security-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true
jobs:
    static-analysis:
        name: C/C++ static analysis
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v4
              with:
                  persist-credentials: false
            - name: Install dependencies
              run: |
                  sudo apt-get update
                  sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
                    clang clang-tidy cmake g++ ninja-build pkg-config python3 \
                    libwayland-dev qt6-base-dev qt6-declarative-dev \
                    qt6-wayland-dev libqt6-opengl6-dev
            - name: Verify analyzer behavior
              run: python3 tests/security/test_analyzer.py clang-tidy
            - name: Configure clang-tidy
              run: >
                  cmake -S . -B build -G Ninja
                  -DCMAKE_BUILD_TYPE=Debug
                  -DCMAKE_C_COMPILER=clang
                  -DCMAKE_CXX_COMPILER=clang++
                  -DCMAKE_CXX_CLANG_TIDY=clang-tidy
            - name: Analyze production code
              run: cmake --build build --parallel 2

    codeql:
        name: CodeQL security analysis
        runs-on: ubuntu-24.04
        timeout-minutes: 30
        permissions:
            actions: read
            contents: read
            security-events: write
        steps:
            - uses: actions/checkout@v4
              with:
                  persist-credentials: false
            - name: Install dependencies
              run: |
                  sudo apt-get update
                  sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
                    cmake g++ ninja-build pkg-config libwayland-dev \
                    qt6-base-dev qt6-declarative-dev qt6-wayland-dev \
                    libqt6-opengl6-dev
            - uses: github/codeql-action/init@v4
              with:
                  languages: c-cpp
                  build-mode: manual
                  config-file: ./.github/codeql/config.yml
            - name: Build for CodeQL
              run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug && cmake --build build --parallel 2
            - uses: github/codeql-action/analyze@v4
              id: codeql
              with:
                  output: codeql-results
            - name: Reject CodeQL findings
              if: always() && (steps.codeql.outcome == 'success' || hashFiles('codeql-results/*.sarif') != '')
              run: python3 scripts/security/check_sarif.py codeql-results
